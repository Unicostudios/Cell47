<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Jarvis</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: default;
               font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif; color: #f2f2f2;
               -webkit-user-select: none; user-select: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .drag { position: fixed; left: 0; right: 0; top: 0; height: 30px; -webkit-app-region: drag; }
  .stage { position: fixed; left: 0; right: 0; bottom: 14vh; display: grid; justify-items: center; gap: 14px; }
  .mark { font-size: 12px; font-weight: 500; letter-spacing: .6em; margin-right: -.6em; color: rgba(255,255,255,.82); }
  .mark span { opacity: 0; display: inline-block; filter: blur(6px); transform: translateY(6px);
               animation: letter .9s cubic-bezier(.2,.8,.2,1) forwards; }
  @keyframes letter { to { opacity: 1; filter: none; transform: none; } }
  .status { font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: rgba(255,255,255,.42);
            height: 14px; transition: opacity .35s ease; }
  .bar { width: 160px; height: 1px; background: rgba(255,255,255,.1); overflow: hidden; border-radius: 1px; }
  .bar i { display: block; height: 100%; width: 40%; background: linear-gradient(90deg, transparent, #fff, transparent);
           animation: sweep 1.6s cubic-bezier(.6,0,.4,1) infinite; }
  @keyframes sweep { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
  body.out .stage, body.out canvas { transition: opacity .6s ease, transform .6s ease; opacity: 0; }
  body.out .stage { transform: translateY(8px); }
  @media (prefers-reduced-motion: reduce) { .bar i { animation: none; width: 100%; opacity: .4; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="drag"></div>
<div class="stage">
  <div class="mark" id="mark"></div>
  <div class="status" id="status">Waking up</div>
  <div class="bar"><i></i></div>
</div>
<script>
  // Jarvis loader: grains of light gather into the form while thin orbits draw in
  // around it, the same language as the home screen it hands over to.
  (function () {
    var mark = document.getElementById("mark");
    "JARVIS".split("").forEach(function (ch, i) {
      var s = document.createElement("span"); s.textContent = ch; s.style.animationDelay = (0.35 + i * 0.09) + "s"; mark.appendChild(s);
    });
    var lines = ["Waking up", "Reaching your calendar", "Reading your inbox", "Syncing Notion", "Checking your watch", "Almost ready"];
    var li = 0, status = document.getElementById("status");
    setInterval(function () {
      if (li >= lines.length - 1) return;
      status.style.opacity = 0;
      setTimeout(function () { li++; status.textContent = lines[li]; status.style.opacity = 1; }, 350);
    }, 1500);

    var c = document.getElementById("c"), ctx = c.getContext("2d");
    var W = 0, H = 0, DPR = Math.min(2, window.devicePixelRatio || 1);
    function size() { W = innerWidth; H = innerHeight; c.width = W * DPR; c.height = H * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0); }
    size(); addEventListener("resize", size);

    // points on a sphere, each with a random start far away
    var N = 2600, P = [];
    for (var i = 0; i < N; i++) {
      var y = 1 - (i / (N - 1)) * 2, r = Math.sqrt(1 - y * y), th = i * 2.399963;
      var a = Math.random() * Math.PI * 2, d = 2.5 + Math.random() * 3;
      P.push({ x: Math.cos(th) * r, y: y, z: Math.sin(th) * r, sx: Math.cos(a) * d, sy: (Math.random() - .5) * 3, sz: Math.sin(a) * d,
               w: 0.6 + Math.random() * 0.8, delay: Math.random() * 0.5 });
    }
    var RINGS = [[2.15, 1.25, 0.6, 0.2], [2.45, 1.05, -0.9, 0.6], [1.85, 1.6, 1.2, -0.4]];
    var t0 = performance.now(), leaving = 0;

    function bump(x, y, z, t) {      // soft folds, like the home form
      return 0.16 * Math.sin(x * 2.1 + t * 0.9) * Math.cos(y * 1.7 - t * 0.6) + 0.12 * Math.sin(z * 2.6 + y * 1.3 + t * 0.7);
    }
    function ease(x) { x = Math.max(0, Math.min(1, x)); return 1 - Math.pow(1 - x, 3); }

    function draw(now) {
      var t = (now - t0) / 1000;
      ctx.globalCompositeOperation = "source-over";
      ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
      var cx = W / 2, cy = H * 0.44, R = Math.min(W, H) * 0.17;
      var rotY = t * 0.35, rotX = Math.sin(t * 0.2) * 0.35;
      var cyR = Math.cos(rotY), syR = Math.sin(rotY), cxR = Math.cos(rotX), sxR = Math.sin(rotX);
      var out = leaving ? ease((now - leaving) / 600) : 0;

      ctx.globalCompositeOperation = "lighter";
      // orbit rings, drawn in one after another, with a faint colour split
      RINGS.forEach(function (rg, k) {
        var prog = ease((t - 0.3 - k * 0.35) / 1.4);
        if (prog <= 0) return;
        var tilt = rg[2] + t * 0.05 * (k % 2 ? -1 : 1), turn = rg[3] + t * 0.12 * (k % 2 ? 1 : -1);
        [["rgba(255,80,80,0.22)", -1.2], ["rgba(80,255,180,0.18)", 0], ["rgba(90,120,255,0.22)", 1.2], ["rgba(255,255,255,0.20)", 0]].forEach(function (col) {
          ctx.strokeStyle = col[0]; ctx.lineWidth = 1; ctx.beginPath();
          var steps = Math.max(2, Math.floor(180 * prog));
          for (var s = 0; s <= steps; s++) {
            var a = (s / 180) * Math.PI * 2;
            var x = Math.cos(a) * rg[0], y = Math.sin(a) * rg[1], z = 0;
            var y1 = y * Math.cos(tilt) - z * Math.sin(tilt), z1 = y * Math.sin(tilt) + z * Math.cos(tilt);
            var x2 = x * Math.cos(turn) + z1 * Math.sin(turn), z2 = -x * Math.sin(turn) + z1 * Math.cos(turn);
            var k2 = 3.4 / (3.4 + z2 * 0.5) * (1 - out * 0.4);
            var px = cx + x2 * R * k2 + col[1] * (1 + out * 4), py = cy + y1 * R * k2;
            if (s === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
          }
          ctx.stroke();
        });
      });

      // grains gathering into the form
      for (var i = 0; i < N; i++) {
        var p = P[i];
        var g = ease((t - 0.2 - p.delay) / 1.8);
        var b = 1 + bump(p.x, p.y, p.z, t) * g;
        var x = p.sx + (p.x * b - p.sx) * g, y = p.sy + (p.y * b - p.sy) * g, z = p.sz + (p.z * b - p.sz) * g;
        var x1 = x * cyR + z * syR, z1 = -x * syR + z * cyR;
        var y1 = y * cxR - z1 * sxR, z2 = y * sxR + z1 * cxR;
        var k = 3.4 / (3.4 + z2) * (1 - out * 0.5);
        var px = cx + x1 * R * k, py = cy + y1 * R * k;
        var depth = (1.4 - z2) / 2.8;
        var alpha = (0.18 + 0.7 * depth) * (0.35 + 0.65 * g) * (1 - out);
        ctx.fillStyle = "rgba(255,255,255," + alpha.toFixed(3) + ")";
        var sz = p.w * (0.6 + depth * 0.9);
        ctx.fillRect(px, py, sz, sz);
      }
      requestAnimationFrame(draw);
    }
    requestAnimationFrame(draw);

    window.fadeOut = function () { if (leaving) return; leaving = performance.now(); document.body.classList.add("out"); };
  })();
</script>
</body>
</html>
